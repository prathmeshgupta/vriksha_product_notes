<style>
  :root{
    --bg:#0f1115; --panel:#161922; --panel2:#1c202b; --border:#2a2f3d;
    --text:#e8eaf0; --text-dim:#9aa1b4; --accent:#6ea8ff; --accent2:#8f7bff;
    --green:#4ade80; --amber:#fbbf24; --red:#f87171;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.5;
  }
  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:300px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
    padding:20px 16px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{font-size:15px; font-weight:700; letter-spacing:.2px; margin-bottom:2px;}
  .brand-sub{font-size:11px; color:var(--text-dim); margin-bottom:20px;}
  .nav-group-title{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin:18px 0 8px;}
  .nav-item{
    display:block; padding:9px 10px; border-radius:8px; cursor:pointer; margin-bottom:3px;
    color:var(--text-dim); font-size:13px; border:1px solid transparent; transition:.12s;
  }
  .nav-item:hover{background:var(--panel2); color:var(--text);}
  .nav-item.active{background:rgba(110,168,255,.12); color:var(--accent); border-color:rgba(110,168,255,.35); font-weight:600;}
  .nav-item .code{font-size:10px; opacity:.7; display:block; margin-top:1px;}
  .main{flex:1; padding:28px 36px; max-width:1180px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:12px; flex-wrap:wrap;}
  .topbar h1{font-size:20px; margin:0;}
  .btn{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:500;
    display:inline-flex; align-items:center; gap:6px; transition:.12s;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#0b0d12; font-weight:700;}
  .btn.primary:hover{filter:brightness(1.08); color:#0b0d12;}
  .btn.small{padding:5px 10px; font-size:12px;}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px;}
  .grid-overview{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px;}
  .p-card{cursor:pointer;}
  .p-card:hover{border-color:var(--accent);}
  .p-card .tag{
    display:inline-block; font-size:10px; padding:2px 8px; border-radius:20px;
    background:rgba(110,168,255,.14); color:var(--accent); margin-bottom:8px; font-weight:600; letter-spacing:.02em;
  }
  .p-card .tag.sys{background:rgba(143,123,255,.16); color:var(--accent2);}
  .p-card h3{font-size:14.5px; margin:0 0 6px; line-height:1.35;}
  .p-card p{color:var(--text-dim); font-size:12.5px; margin:0 0 10px;}
  .p-card .meta{display:flex; gap:14px; font-size:11.5px; color:var(--text-dim);}
  .risk-badge{padding:1px 8px; border-radius:20px; font-size:10.5px; font-weight:700;}
  .risk-high{background:rgba(248,113,113,.15); color:var(--red);}
  .risk-mod{background:rgba(251,191,36,.15); color:var(--amber);}
  .risk-low{background:rgba(74,222,128,.15); color:var(--green);}
  .risk-var{background:rgba(110,168,255,.15); color:var(--accent);}
  h2.section{font-size:16px; margin:28px 0 12px; border-bottom:1px solid var(--border); padding-bottom:8px;}
  .kv{display:grid; grid-template-columns:180px 1fr; gap:6px 16px; margin-bottom:4px; font-size:13px;}
  .kv .k{color:var(--text-dim);}
  table{width:100%; border-collapse:collapse; font-size:12.5px; margin:10px 0;}
  th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--border);}
  th{color:var(--text-dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
  .variant-tabs{display:flex; gap:6px; margin-bottom:14px;}
  .variant-tab{
    padding:6px 14px; border-radius:20px; background:var(--panel2); border:1px solid var(--border);
    cursor:pointer; font-size:12.5px; font-weight:600; color:var(--text-dim);
  }
  .variant-tab.active{background:rgba(110,168,255,.15); color:var(--accent); border-color:var(--accent);}
  .risk-list{margin:8px 0 0; padding-left:18px;}
  .risk-list li{margin-bottom:5px; color:var(--text-dim); font-size:12.5px;}
  .callout{background:var(--panel2); border-left:3px solid var(--accent); padding:10px 14px; border-radius:6px; font-size:12.5px; color:var(--text-dim); margin:10px 0;}
  .callout.warn{border-left-color:var(--amber);}
  .upload-zone{
    border:1.5px dashed var(--border); border-radius:10px; padding:26px; text-align:center; color:var(--text-dim);
    cursor:pointer; font-size:13px; margin-top:10px;
  }
  .upload-zone:hover{border-color:var(--accent); color:var(--accent);}
  .pill{display:inline-block; background:var(--panel2); border:1px solid var(--border); padding:3px 10px; border-radius:20px; font-size:11.5px; margin:0 5px 5px 0; color:var(--text-dim);}
  .search-box{
    width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); font-size:13px; margin-bottom:14px;
  }
  .footer-note{color:var(--text-dim); font-size:11.5px; margin-top:30px; border-top:1px solid var(--border); padding-top:14px;}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#2a2f3d; border-radius:5px;}
  .roadmap-item{display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);}
  .roadmap-item:last-child{border-bottom:none;}
  .roadmap-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0;}
  #csvResult{margin-top:14px;}
</style>
</head>

<script>
const PRODUCTS = [{"id":"P1","code":"DSOP","name":"Complete Discretionary Stock-Only Portfolio","shortName":"Discretionary Equity (GARP + Value + Special Situations)","category":"Discretionary — Single Asset Class (Equity)","assetClasses":["Indian Equities (direct stocks)"],"objective":"To generate long-term capital appreciation ahead of the broad market by discretionarily blending three complementary equity styles — Growth at a Reasonable Price (GARP), Value, and Special Situations — within a single concentrated stock portfolio, with the fund manager retaining full discretion over stock selection, weights, and style tilt through the cycle.","philosophy":"Pure styles are cyclical: value outperforms growth for years and then reverses; special situations are episodic and lumpy. A discretionary manager who can shift emphasis across GARP, Value, and Special Situations as the cycle turns should produce a smoother, more consistent return stream than any single style sleeve run in isolation. This product is unconstrained by a fixed sub-allocation formula — sleeve weights are a house call, reviewed at least quarterly, and disclosed after the fact.","styleSleeves":[{"name":"GARP (Growth at a Reasonable Price)","weightRange":"35–55%","criteria":"Earnings CAGR (3-yr fwd estimate) > 15%; PEG ratio < 1.5; ROE > 15%; consistent EPS upgrades over trailing 2 quarters; net debt/EBITDA < 2x.","universe":"Nifty 500 constituents, large- and mid-cap bias","indicativeNames":"Titan Company, Divi's Laboratories, Trent, Polycab India, Cholamandalam Investment & Finance"},{"name":"Value","weightRange":"25–40%","criteria":"P/E and P/B below 5-year sector median; EV/EBITDA discount to peer set; dividend yield > sector average; free cash flow positive for 3 consecutive years.","universe":"Nifty 500, cross-cap, benchmarked loosely against Nifty500 Value 50 construction logic (E/P, B/P, S/P, dividend yield composite)","indicativeNames":"Coal India, NTPC, ONGC, select PSU banks, Bharat Petroleum"},{"name":"Special Situations","weightRange":"15–25%","criteria":"Demerger/spin-off arbitrage, corporate restructuring, regulatory-driven re-rating, promoter/PE stake unlocks, turnaround post-stress (asset quality or leverage normalization), open offers/delisting-adjacent situations.","universe":"Cross-cap, event-driven, idiosyncratic — not benchmark-anchored","indicativeNames":"Post-demerger listings, PSU disinvestment candidates, companies exiting IBC/restructuring with visible earnings normalization (illustrative category, not standing recommendations)"}],"portfolioConstruction":"15–25 stocks. Single-stock cap 10% at initiation, sector cap 30% (25% for BFSI). No derivatives, no leverage, no short positions — long-only, fully invested with cash held only for liquidity/redemption buffer (typically 0–5%).","benchmark":"Nifty 500 TRI (primary); Nifty500 Multicap 50:25:25 TRI (secondary, for cap-mix comparison)","rebalanceFrequency":"Discretionary review monthly; formal sleeve-weight and constituent rebalance quarterly, or ad hoc on trigger events (earnings shock, corporate action, stop-loss breach at −20% from entry on a single name).","riskProfile":"High","suitability":"Investors with a 5+ year horizon, high risk tolerance, and comfort with concentrated, benchmark-agnostic equity exposure. Not suitable for capital-protection mandates or horizons under 3 years.","minInvestment":"As per smallcase platform minimum (typically ₹15,000–₹50,000 depending on constituent prices); this is a model-portfolio subscription, not a SEBI-registered PMS mandate (PMS carries a ₹50 lakh regulatory minimum under SEBI (Portfolio Managers) Regulations, 2020 — not applicable here).","fees":"Subscription/performance fee as configured on the smallcase platform (to be finalized before launch) — placeholder: e.g., flat annual subscription fee, no entry load, exit load nil after platform's standard holding period.","taxNote":"Tax implications (STCG/LTCG on direct equity, no pass-through wrapper) to be detailed in a future revision. Not covered in this version of the note.","keyRisks":["Concentration risk from 15–25 stock construction","Style-timing risk — discretionary sleeve reallocation can lag or mistime cycle turns","Special-situations sleeve carries event risk (deal breaks, delayed corporate actions)","No downside hedge — fully long-only equity exposure","Liquidity risk in mid/small-cap names during stress"]},{"id":"P2","code":"DMAP","name":"Complete Discretionary Multi-Asset Portfolio","shortName":"Discretionary Multi-Asset (Equity + REITs + InvITs + ETFs)","category":"Discretionary — Multi Asset Class","assetClasses":["Indian Equities (direct stocks)","REITs","InvITs","Sectoral ETFs","Index ETFs","Factor ETFs","Commodity ETFs","Debt/Cash ETFs"],"objective":"To deliver risk-adjusted total return by combining the stock-only GARP+Value+Special Situations sleeve (Product 1) with listed real-asset yield instruments (REITs, InvITs) and a full ETF toolkit (index, sectoral, factor, commodity, debt/cash) under a single discretionarily-managed, all-weather mandate.","philosophy":"This is the flagship 'one portfolio does everything' product: it retains the alpha-seeking equity engine from Product 1 but wraps it with diversifiers that behave differently across the cycle — REITs and InvITs for bond-like income with equity-like inflation participation, factor and sectoral ETFs for tactical tilts without single-stock risk, commodity ETFs (principally gold) as a portfolio hedge, and debt/cash ETFs as the ballast. Allocation across the eight sleeves is fully discretionary and reviewed at least monthly against a macro/valuation dashboard (rates direction, equity valuation percentile, credit spreads, gold momentum).","strategicAllocationRanges":[{"sleeve":"Direct Equities (GARP+Value+Special Situations, per Product 1)","range":"35–55%"},{"sleeve":"Index ETFs (Nifty 50 / Next 50 / Midcap 150)","range":"5–15%"},{"sleeve":"Sectoral ETFs (tactical)","range":"0–10%"},{"sleeve":"Factor ETFs (Momentum/Alpha/Quality/Low-Vol)","range":"5–15%"},{"sleeve":"REITs (Embassy, Mindspace, Brookfield India, Nexus Select, Knowledge Realty)","range":"5–12%"},{"sleeve":"InvITs (IndiGrid, PowerGrid InvIT, IRB InvIT, National Highways Infra Trust)","range":"5–12%"},{"sleeve":"Commodity ETFs (Gold BeES, Silver BeES)","range":"3–10%"},{"sleeve":"Debt/Cash ETFs (Liquid ETF, Bharat Bond ETF, G-Sec ETF)","range":"5–15%"}],"indicativeInstruments":{"reits":"Embassy Office Parks REIT, Mindspace Business Parks REIT, Brookfield India Real Estate Trust, Nexus Select Trust, Knowledge Realty Trust","invits":"IndiGrid Infrastructure Trust, PowerGrid Infrastructure Investment Trust, IRB InvIT Fund, National Highways Infra Trust","indexETFs":"Nippon India ETF Nifty 50 BeES, Nippon India ETF Nifty Next 50 Junior BeES, Nippon India ETF Nifty Midcap 150","sectoralETFs":"Nippon India ETF Nifty Bank BeES, Nippon India ETF Nifty IT, Nippon India ETF Nifty Pharma, Nippon India ETF Nifty India Consumption (FMCG-oriented)","factorETFs":"Nippon India ETF Nifty Alpha Low Volatility 30, ICICI Prudential Nifty Alpha Low-Volatility 30 ETF, Nifty 200 Momentum 30-linked ETFs, Nifty500 Value 50-linked ETFs","commodityETFs":"Nippon India ETF Gold BeES, Nippon India ETF Silver BeES, HDFC Silver ETF","debtCashETFs":"Bharat Bond ETF (target-maturity series), Nippon India ETF Nifty 1D Rate Liquid BeES, LIC MF Nifty 8-13yr G-Sec ETF"},"benchmark":"Custom blended benchmark: 55% Nifty 500 TRI + 15% Nifty REITs & InvITs Index + 15% Nifty 50 Arbitrage/Gold composite + 15% CRISIL Composite Bond Index (weights indicative, to be fixed at launch and disclosed in factsheet).","rebalanceFrequency":"Sleeve-level allocation reviewed monthly; full rebalance to target bands quarterly; hedge/gold sleeve can be adjusted ad hoc on volatility triggers (India VIX > 20).","riskProfile":"Moderate-High (lower than Product 1 due to REIT/InvIT/debt ballast)","suitability":"Investors wanting a single all-in-one discretionary product spanning growth, income, and inflation-hedge sleeves, 4+ year horizon, comfortable with equity-linked drawdowns of 15–25% in stress scenarios.","minInvestment":"As per smallcase platform minimum; not a SEBI PMS mandate.","fees":"To be finalized before launch — placeholder subscription-fee structure per smallcase convention.","taxNote":"Multi-instrument tax treatment (equity STCG/LTCG, REIT/InvIT distribution taxability split between interest/dividend/capital-return components, ETF capital gains) to be detailed in a future revision.","keyRisks":["REIT/InvIT distributions are not guaranteed and are sensitive to occupancy, toll traffic, and regulated tariff resets","Interest-rate sensitivity in InvIT and debt ETF sleeves","Multi-instrument complexity increases tracking and rebalancing friction/costs","Sectoral and factor ETF tilts add cyclicality risk if mistimed","Gold/silver sleeve can drag returns in strong equity bull phases"]},{"id":"P3","code":"DMAERI-RB","name":"Discretionary Multi-Asset ETF/REIT/InvIT Portfolio — Risk-Profiled (Aggressive/Moderate/Conservative)","shortName":"Discretionary Multi-Asset ETF/REIT/InvIT — by Risk Profile","category":"Discretionary — Multi Asset, ETF/REIT/InvIT only (no direct stocks)","assetClasses":["Index ETFs","Sectoral ETFs","Factor ETFs","Commodity ETFs","Debt/Cash ETFs","REITs","InvITs"],"objective":"To offer a fully liquid, exchange-traded, no-direct-stock multi-asset portfolio built entirely from ETFs, REITs, and InvITs, discretionarily allocated across three risk bands so investors can select the variant matching their risk capacity without needing a bespoke stock-picking mandate.","philosophy":"Every constituent here trades on-exchange with T+1 settlement and daily NAV/price discovery — this product exists for investors who want multi-asset diversification with maximum liquidity and minimum single-security risk (no direct equities). The three variants differ only in strategic weight bands between growth (equity ETFs/factor ETFs), income/real-asset (REITs/InvITs), and defensive (debt/cash/gold) sleeves; the instrument universe is shared.","variants":[{"profile":"Aggressive","targetInvestor":"10+ year horizon, high risk tolerance, prioritizes growth over income stability.","allocation":[{"sleeve":"Index ETFs (broad + midcap)","range":"30–40%"},{"sleeve":"Factor ETFs (Momentum/Alpha)","range":"15–20%"},{"sleeve":"Sectoral ETFs (tactical)","range":"5–10%"},{"sleeve":"REITs","range":"8–12%"},{"sleeve":"InvITs","range":"8–12%"},{"sleeve":"Commodity ETFs (Gold/Silver)","range":"3–7%"},{"sleeve":"Debt/Cash ETFs","range":"5–10%"}],"expectedEquityLikeExposure":"~75–85%"},{"profile":"Moderate","targetInvestor":"5–10 year horizon, balanced risk tolerance, wants growth with meaningful income ballast.","allocation":[{"sleeve":"Index ETFs (broad + midcap)","range":"20–28%"},{"sleeve":"Factor ETFs (Quality/Low-Vol tilt)","range":"10–15%"},{"sleeve":"Sectoral ETFs (tactical)","range":"0–8%"},{"sleeve":"REITs","range":"10–15%"},{"sleeve":"InvITs","range":"10–15%"},{"sleeve":"Commodity ETFs (Gold/Silver)","range":"5–10%"},{"sleeve":"Debt/Cash ETFs","range":"15–25%"}],"expectedEquityLikeExposure":"~50–60%"},{"profile":"Conservative","targetInvestor":"3–5 year horizon, low risk tolerance, prioritizes capital stability and income over growth.","allocation":[{"sleeve":"Index ETFs (broad, large-cap only)","range":"8–15%"},{"sleeve":"Factor ETFs (Low-Vol only)","range":"5–8%"},{"sleeve":"Sectoral ETFs (tactical)","range":"0%"},{"sleeve":"REITs","range":"8–12%"},{"sleeve":"InvITs","range":"8–12%"},{"sleeve":"Commodity ETFs (Gold only, inflation hedge)","range":"5–10%"},{"sleeve":"Debt/Cash ETFs","range":"40–55%"}],"expectedEquityLikeExposure":"~20–30%"}],"sharedInstrumentUniverse":{"indexETFs":"Nippon India ETF Nifty 50 BeES, Nippon India ETF Nifty Next 50 Junior BeES, Nippon India ETF Nifty Midcap 150, Mirae Asset Nifty Midcap 150 ETF","sectoralETFs":"Nifty Bank, Nifty IT, Nifty Pharma, Nifty India Consumption ETFs (Nippon India ETF suite, tactical overlay only)","factorETFs":"Nippon India/ICICI Prudential Nifty Alpha Low-Volatility 30 ETF, Nifty 200 Momentum 30 and Nifty500 Value 50-linked ETFs","commodityETFs":"Nippon India ETF Gold BeES, Nippon India ETF Silver BeES","debtCashETFs":"Bharat Bond ETF (maturity-matched to horizon), Nippon India ETF Nifty 1D Rate Liquid BeES, LIC MF Nifty 8-13yr G-Sec ETF","reits":"Embassy Office Parks REIT, Mindspace Business Parks REIT, Brookfield India Real Estate Trust, Nexus Select Trust","invits":"IndiGrid Infrastructure Trust, PowerGrid InvIT, National Highways Infra Trust (Aggressive/Moderate may add IRB InvIT for higher yield/higher risk)"},"benchmark":"Aggressive: 75% Nifty 500 TRI + 25% Nifty REITs & InvITs Index. Moderate: 50% Nifty 500 TRI + 20% Nifty REITs & InvITs Index + 30% CRISIL Composite Bond Index. Conservative: 25% Nifty 500 TRI + 15% Nifty REITs & InvITs Index + 60% CRISIL Composite Bond Index.","rebalanceFrequency":"Quarterly calendar rebalance to target bands across all three variants; risk-band drift check monthly (rebalance triggered early if any sleeve breaches its band by >5 percentage points).","riskProfile":"Variant-dependent: Aggressive = High, Moderate = Moderate, Conservative = Low-Moderate","suitability":"Investors who want multi-asset diversification but prefer to avoid single-stock risk entirely, choosing the variant matched to their declared risk profile via a standard risk-assessment questionnaire.","minInvestment":"As per smallcase platform minimum for each variant.","fees":"To be finalized before launch — likely uniform subscription fee across the three variants.","taxNote":"To be detailed in a future revision (ETF capital gains, REIT/InvIT distribution component taxability).","keyRisks":["Sectoral/factor ETF tactical sleeves can whipsaw in choppy markets","REIT/InvIT sleeve concentrated in ~9 listed instruments (limited universe in India as of 2026)","Conservative variant still carries ~20-30% equity-like exposure — not a capital-guarantee product","ETF tracking error versus underlying index, especially in less liquid factor ETFs"]},{"id":"P4","code":"DMAMF-RB","name":"Discretionary Multi-Asset Mutual Fund Portfolio — Risk-Profiled (Aggressive/Moderate/Conservative)","shortName":"Discretionary Multi-Asset MF — by Risk Profile","category":"Discretionary — Multi Asset, Mutual Funds only","assetClasses":["Index Funds","Sector Funds","Factor/Smart-Beta Funds","Commodity Funds (Gold/Silver FoF)","Debt/Liquid Funds","REIT/InvIT-focused Funds/FoFs"],"objective":"To replicate the multi-asset diversification of Product 3 using open-ended mutual fund schemes instead of ETFs — for investors who prefer SIP/lumpsum mutual fund rails, don't have (or don't want) a demat/trading account workflow for every transaction, and are comfortable with fund-level expense ratios instead of brokerage/impact cost.","philosophy":"Mutual funds settle T+2/T+3, don't require intraday trading, and support SIPs — a meaningfully different operational profile from ETFs despite tracking similar underlying indices. This product exists as the MF-native equivalent of Product 3 for investors and distributors who operate primarily through the mutual fund ecosystem (folios, SIPs, direct plans).","variants":[{"profile":"Aggressive","allocation":[{"sleeve":"Index Funds (Nifty 50/Next 50/Midcap 150)","range":"30–40%"},{"sleeve":"Factor/Smart-beta Funds (Momentum/Alpha)","range":"15–20%"},{"sleeve":"Sector Funds (tactical)","range":"5–10%"},{"sleeve":"REIT/InvIT-oriented Funds/FoFs","range":"12–18%"},{"sleeve":"Commodity Funds (Gold/Silver FoF)","range":"3–7%"},{"sleeve":"Debt/Liquid Funds","range":"5–10%"}]},{"profile":"Moderate","allocation":[{"sleeve":"Index Funds","range":"20–28%"},{"sleeve":"Factor/Smart-beta Funds (Quality/Low-Vol)","range":"10–15%"},{"sleeve":"Sector Funds (tactical)","range":"0–8%"},{"sleeve":"REIT/InvIT-oriented Funds/FoFs","range":"15–20%"},{"sleeve":"Commodity Funds (Gold/Silver FoF)","range":"5–10%"},{"sleeve":"Debt/Liquid Funds","range":"20–30%"}]},{"profile":"Conservative","allocation":[{"sleeve":"Index Funds (large-cap only)","range":"8–15%"},{"sleeve":"Factor/Smart-beta Funds (Low-Vol only)","range":"5–8%"},{"sleeve":"Sector Funds","range":"0%"},{"sleeve":"REIT/InvIT-oriented Funds/FoFs","range":"10–15%"},{"sleeve":"Commodity Funds (Gold FoF)","range":"5–10%"},{"sleeve":"Debt/Liquid Funds","range":"45–60%"}]}],"indicativeInstruments":{"indexFunds":"Motilal Oswal / Nippon India / ICICI Pru / SBI / UTI Nifty 50, Nifty Next 50 and Nifty Midcap 150 Index Funds (direct plan)","factorFunds":"Nippon India Nifty Alpha Low Volatility 30 Index Fund, Edelweiss Nifty Alpha Low Vol 30 Index Fund, index funds tracking Nifty 200 Momentum 30 / Nifty500 Value 50","sectorFunds":"Banking & Financial Services, Technology, Pharma & Healthcare, and Consumption sector/thematic funds (house-approved list, tactical only)","commodityFunds":"Gold ETF Fund-of-Funds and Silver ETF FoF structures (e.g., Nippon India / ICICI Prudential / Kotak Gold Savings Fund) for investors without demat access","debtLiquidFunds":"Liquid funds, ultra-short duration funds, target-maturity debt index funds (Bharat Bond FoF variants)","reitInvitExposure":"Where a direct REIT/InvIT mutual fund wrapper is unavailable, exposure taken via hybrid/allocation funds with disclosed REIT/InvIT holdings, or via direct REIT/InvIT units held in the same folio-linked demat account where the platform supports it."},"benchmark":"Same blended benchmarks as Product 3, substituting TRI index values (fund performance measured pre-expense-ratio drag against index TRI).","rebalanceFrequency":"Quarterly rebalance; fund selection (scheme-level, not just category-level) reviewed semi-annually for expense ratio, tracking error, and fund manager continuity.","riskProfile":"Variant-dependent: Aggressive = High, Moderate = Moderate, Conservative = Low-Moderate","suitability":"Investors pr t need very different portfolios. This product cross-tabulates goal horizon (which sets the glide path) with declared risk tolerance (which sets the glide path's starting aggressiveness and floor), using the same ETF/REIT/InvIT universe as Product 3.","goalFramework":[{"goal":"Retirement (long horizon, 15+ years)","horizonBand":"15+ years to goal","glidePath":"Starts at Aggressive-equivalent allocation (per Product 3), holds until T-10 years, then linearly de-risks toward Conservative-equivalent by the goal date, increasing debt/cash and REIT/InvIT income sleeves at the expense of factor/sectoral ETFs.","riskProfileAdjustment":"Aggressive investor: stays at upper equity band longer (to T-7yrs). Conservative investor: begins de-risking earlier (from T-15yrs)."},{"goal":"Child's Education","horizonBand":"5–18 years to goal (goal date is largely fixed/inflexible)","glidePath":"Because the goal date cannot be deferred like retirement, de-risking is more front-loaded — glide begins at T-7 years regardless of risk profile, reaching a Conservative-equivalent allocation by T-2 years to avoid sequence-of-returns risk right before the expense hits.","riskProfileAdjustment":"Adjusts only the starting aggressiveness and pace of glide, not the requirement to be near-fully de-risked by T-1 year."},{"goal":"Home Down-Payment","horizonBand":"2–7 years to goal","glidePath":"Short-horizon goal — starts materially more conservative than retirement/education goals even for Aggressive-risk investors, capped at Moderate-equivalent allocation maximum, with REIT/InvIT and debt/cash sleeves elevated throughout given limited time to recover from a drawdown.","riskProfileAdjustment":"Aggressive investor at 6–7yr horizon may use Moderate-equivalent band; Conservative investor at <3yr horizon should be routed to Product 3's Conservative variant directly rather than this goal wrapper."},{"goal":"General Wealth Accumulation (no fixed date)","horizonBand":"Open-ended, reviewed annually","glidePath ical, non-discretionary, goal-aware portfolio that de-risks on a fixed schedule as the goal date approaches.","philosophy":"This is the most 'rules on rules' product in the suite: the equity sleeve is factor-systematic (Product 7 logic), the multi-asset overlay is fixed-allocation systematic (Product 8 logic), and the goal adaptation is a scheduled glide path (Products 5/6 logic) rather than discretionary judgment. Every allocation decision in this product — security selection, sleeve weight, and time-based de-risking — follows a pre-published rule, leaving no discretionary decision points after initial goal/risk-profile classification.","goalFramework":[{"goal":"Retirement (15+ years)","horizonBand":"15+ years to goal","glidePath":"Starts at Product 8's Aggressive variant, holds until T-10 years, then steps down annually through Moderate toward Conservative by the goal date — identical step-down calendar logic to Product 5/6, applied to Product 8's fixed sleeve weights at each step."},{"goal":"Child's Education (5–18 years)","horizonBand":"5–18 years to goal","glidePath":"Front-loaded de-risking from T-7 years to near-fully Conservative by T-1 year, per the Product 5/6 education schedule, using Product 8's mechanical sleeve construction at each step."},{"goal":"Home Down-Payment (2–7 years)","horizonBand":"2–7 years to goal","glidePath":"Capped at Moderate-equivalent even for Aggressive-risk investors beyond a 6-year horizon; below 3 years, investor is routed directly to Product 8's Conservative variant rather than a goal-wrapped glide."},{"goal":"General Wealth Accumulation","horizonBand":"Open-ended","glidePath":"Static allocation at the investor's declared risk-profile-matched Product 8 variant; no time-based step-down."}],"portfolioConstructionNote":"No new instruments or selection rules are introduced versus Product 8 — this product only adds the fixed, calendar-based glide-path step-down schedule. All equity factor screening, REIT/InvIT equal-weighting, and gold/cash instrument selection rules are inherited unchanged from Products 7 and 8.","benchmark":"Dynamic, glide-path-matched blend of Product 8's three variant benchmarks, stepping down on the same schedule as the portfolio.","rebalanceFrequency":"Quarterly mechanical rebalance within the current glide-path step; annual (or goal-specific) step-down per the schedule above — both fully calendar-driven, no discretionary triggers.","riskProfile":"Time-varying by design, mechanically determined by goal horizon and declared risk profile — the least discretionary product in the entire suite.","suitability":"Investors who want maximum rules-based transparency and minimum manager discretion in a goal-based multi-asset product — e.g., investors who specifically want to avoid manager judgment calls at every level of the portfolio.","minInvestment":"As per smallcase platform minimum.","fees":"To be finalized before launch — expected to be the lowest-cost product in the suite given full systematic construction at both the security-selection and glide-path level.","taxNote":"To be detailed in a future revision.","keyRisks":["Same glide-path timing risk as Products 5/6 — de-risks on schedule regardless of market conditions","Same factor cyclicality and equal-weight REIT/InvIT construction risks as Products 7/8","Zero discretionary override means the product cannot deviate from its rules even if a manager would judge deviation prudent (e.g., an obviously deteriorating REIT sponsor) — by design, but worth flagging explicitly to investors as a trade-off, not an oversight"]}];

let currentView = "overview";
let currentProductId = null;
let uploadedConstituents = {}; // { productId: [{symbol,name,weight}] }

function riskClass(r){
  if(!r) return "risk-var";
  const s = r.toLowerCase();
  if(s.includes("variant") || s.includes("time-varying")) return "risk-var";
  if(s.includes("high")) return "risk-high";
  if(s.includes("moderate") || s.includes("mod")) return "risk-mod";
  if(s.includes("low")) return "risk-low";
  return "risk-var";
}

function renderNav(){
  const q = (document.getElementById("navSearch").value || "").toLowerCase();
  const list = document.getElementById("navList");
  list.innerHTML = "";
  const discretionary = PRODUCTS.filter(p=>p.category.startsWith("Discretionary"));
  const systematic = PRODUCTS.filter(p=>p.category.startsWith("Systematic"));
  function group(title, arr){
    const filtered = arr.filter(p => !q || p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q));
    if(!filtered.length) return;
    const h = document.createElement("div");
    h.className = "nav-group-title";
    h.textContent = title;
    list.appendChild(h);
    filtered.forEach(p=>{
      const el = document.createElement("div");
      el.className = "nav-item" + (currentProductId===p.id && currentView==="product" ? " active" : "");
      el.innerHTML = `${p.shortName || p.name}<span class="code">${p.code} · ${p.id}</span>`;
      el.onclick = ()=>showProduct(p.id);
      list.appendChild(el);
    });
  }
  group("Discretionary (6)", discretionary);
  group("Systematic (3)", systematic);
}

function showView(v){
  currentView = v;
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  const navEl = document.getElementById("nav-"+v);
  if(navEl) navEl.classList.add("active");
  if(v==="overview") renderOverview();
  if(v==="csv") renderCsvView();
  if(v==="roadmap") renderRoadmap();
  renderNav();
}

function showProduct(id){
  currentView = "product";
  currentProductId = id;
  renderProduct(id);
  renderNav();
}

function renderOverview(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="topbar">
      <h1>Product Suite Overview</h1>
      <div class="toolbar">
        <button class="btn" onclick="exportAllXlsx()">Export All → Excel</button>
      </div>
    </div>
    <div class="callout">9 discretionary &amp; systematic portfolio products across single-asset equity, full multi-asset, ETF/REIT/InvIT-only, and mutual-fund-only universes — risk-profiled and goal-based variants included. Click any card for the full product note, or use the sidebar.</div>
    <div class="grid-overview" id="overviewGrid"></div>
  `;
  const grid = document.getElementById("overviewGrid");
  PRODUCTS.forEach(p=>{
    const isSys = p.category.startsWith("Systematic");
    const card = document.createElement("div");
    card.className = "card p-card";
    card.onclick = ()=>showProduct(p.id);
    card.innerHTML = `
      <span class="tag ${isSys?'sys':''}">${p.id} · ${p.code}</span>
      <h3>${p.name}</h3>
      <p>${p.objective.slice(0,140)}...</p>
      <div class="meta">
        <span class="risk-badge ${riskClass(p.riskProfile)}">${p.riskProfile}</span>
        <span>${p.assetClasses.length} asset class${p.assetClasses.length>1?'es':''}</span>
      </div>
    `;
    grid.appendChild(card);
  });
}

function kv(label, value){
  return `<div class="kv"><div class="k">${label}</div><div>${value}</div></div>`;
}

      </div>
      <div class="toolbar">
        <button class="btn" onclick="exportDocx('${p.id}')">Export → Word</button>
        <button class="btn" onclick="exportXlsx('${p.id}')">Export → Excel</button>
        <button class="btn primary" onclick="showView('csv')">Upload Constituents</button>
      </div>
    </div>

    <div class="card">
      ${kv("Risk Profile", `<span class="risk-badge ${riskClass(p.riskProfile)}">${p.riskProfile}</span>`)}
      ${kv("Asset Classes", p.assetClasses.map(a=>`<span class="pill">${a}</span>`).join(""))}
      ${kv("Benchmark", p.benchmark)}
      ${kv("Rebalance Frequency", p.rebalanceFrequency)}
      ${kv("Min. Investment", p.minInvestment || "—")}
      ${kv("Fees", p.fees || "—")}
    </div>

    <h2 class="section">Investment Objective</h2>
    <div class="card"><p>${p.objective}</p></div>

    <h2 class="section">Philosophy &amp; Methodology</h2>
    <div class="card"><p>${p.philosophy || p.selectionMethodology || ""}</p>
    ${p.selectionMethodology && p.philosophy ? `<p style="margin-top:10px;"><strong>Selection Methodology:</strong> ${p.selectionMethodology}</p>` : ""}
    ${p.portfolioConstruction ? `<p style="margin-top:10px;"><strong>Portfolio Construction:</strong> ${p.portfolioConstruction}</p>` : ""}
    ${p.portfolioConstructionNote ? `<div class="callout">${p.portfolioConstructionNote}</div>` : ""}
    </div>
  `;

  // Style sleeves (Product 1)
  if(p.styleSleeves){
    html += `<h2 class="section">Style Sleeves</h2><div class="card">`;
    html += `<table><tr><th>Sleeve</th><th>Weight Range</th><th>Selection Criteria</th><th>Universe</th><th>Indicative Names</th></tr>`;
    p.styleSleeves.forEach(s=>{
      html += `<tr><td><strong>${s.name}</strong></td><td>${s.weightRange}</td><td>${s.criteria}</td><td>${s.universe}</td><td>${s.indicativeNames}</td></tr>`;
    });
    html += `</table></div>`;
  }

  // Strategic allocation ranges (Product 2)
  if(p.strategicAllocationRanges){
    html += `<h2 class="section">Strategic Allocation Ranges</h2><div class="card"><table><tr><th>Sleeve</th><th>Target Range</th></tr>`;
    p.strategicAllocationRanges.forEach(a=>{
      html += `<tr><td>${a.sleeve}</td><td>${a.range}</td></tr>`;
    });
    html += `</table></div>`;
  }

  // Variants (risk-profiled products)
  if(p.variants){
    html += `<h2 class="section">Risk-Profile Variants</h2><div class="card">`;
    html += `<div class="variant-tabs">` + p.variants.map((v,i)=>`<div class="variant-tab ${i===0?'active':''}" onclick="switchVariant('${p.id}',${i})" id="vtab-${p.id}-${i}">${v.profile}</div>`).join("") + `</div>`;
    p.variants.forEach((v,i)=>{
      html += `<div class="variant-panel" id="vpanel-${p.id}-${i}" style="display:${i===0?'block':'none'};">`;
      if(v.targetInvestor) html += `<p style="color:var(--text-dim); font-size:12.5px; margin-bottom:10px;"><strong>Target investor:</strong> ${v.targetInvestor}</p>`;
      if(v.factorMix){
        html += `<div class="kv"><div class="k">Factor Mix</div><div>${v.factorMix}</div></div>`;
        html += `<div class="kv"><div class="k">Universe</div><div>${v.universe}</div></div>`;
        html += `<div class="kv"><div class="k">Stock Count</div><div>${v.stockCount}</div></div>`;
        html += `<div class="kv"><div class="k">Reference Index</div><div>${v.referenceIndex}</div></div>`;
        html += `<p style="margin-top:10px; color:var(--text-dim); font-size:12.5px;">${v.rationale}</p>`;
      }
      if(v.allocation){
        html += `<table><tr><th>Sleeve</th><th>Target Range</th></tr>`;
        v.allocation.forEach(a=>{ html += `<tr><td>${a.sleeve}</td><td>${a.range}</td></tr>`; });
        html += `</table>`;
        if(v.expectedEquityLikeExposure) html += `<div class="kv"><div class="k">Equity-like Exposure</div><div>${v.expectedEquityLikeExposure}</div></div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  }

  // Goal framework
  if(p.goalFramework){
    html += `<h2 class="section">Life Goal Framework (Glide Path)</h2><div class="card">`;
    p.goalFramework.forEach(g=>{
      html += `<div style="margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--border);">
        <strong>${g.goal}</strong> <span class="pill">${g.horizonBand}</span>
        <p style="margin:8px 0 0; color:var(--text-dim); font-size:12.5px;">${g.glidePath}</p>
        ${g.riskProfileAdjustment ? `<p style="margin:6px 0 0; color:var(--text-dim); font-size:12px;"><em>Risk-profile adjustment:</em> ${g.riskProfileAdjustment}</p>` : ""}
      </div>`;
    });
    html += `</div>`;
  }

  // Indicative / shared instrument universe
  const instr = p.indicativeInstruments || p.sharedInstrumentUniverse;
  if(instr){
    html += `<h2 class="section">Indicative Instrument Universe</h2><div class="card">`;
    Object.keys(instr).forEach(k=>{
      html += `<div class="kv"><div class="k">${k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase())}</div><div>${instr[k]}</div></div>`;
    });
    html += `<div class="callout warn">Illustrative universe based on public data as of mid-2026. Reconfirm eligible instruments, tickers, and AUM/liquidity thresholds at each rebalance and before launch.</div>`;
    html += `</div>`;
  }

  html += `<h2 class="section">Suitability</h2><div class="card"><p>${p.suitability}</p></div>`;

  html += `<h2 class="section">Key Risks</h2><div class="card"><ul class="risk-list">`;
  (p.keyRisks||[]).forEach(r=>{ html += `<li>${r}</li>`; });
  html += `</ul></div>`;

  html += `<h2 class="section">Tax &amp; Fees</h2><div class="card">
    ${kv("Fees", p.fees || "—")}
    ${kv("Tax Treatment", p.taxNote || "To be detailed in a future revision.")}
  </div>`;

  html += `<div class="footer-note">Product code ${p.code} · Note generated for internal/product-development use. Not investor-facing until reviewed for SEBI Research Analyst / smallcase compliance requirements, final fee structure, and tax disclosures.</div>`;

  main.innerHTML = html;
}

function switchVariant(pid, idx){
  const p = PRODUCTS.find(x=>x.id===pid);
  p.variants.forEach((v,i)=>{
    document.getElementById(`vpanel-${pid}-${i}`).style.display = i===idx ? "block":"none";
    document.getElementById(`vtab-${pid}-${i}`).classList.toggle("active", i===idx);
  });
}

function renderCsvView(){
  const main = document.getElementById("main");
  const options = PRODUCTS.map(p=>`<option value="${p.id}">${p.id} — ${p.name}</option>`).join("");
  main.innerHTML = `
    <div class="topbar"><h1>CSV Constituent Upload</h1></div>
    <div class="callout">Upload a CSV of constituents and weights for any product (columns: <code>symbol, name, weight</code> — weight as % or decimal). Parsed data is held in-memory for this session and included in Word/Excel exports for the selected product.</div>
    <div class="card">
      <div class="kv"><div class="k">Target Product</div>
        <select id="csvProductSelect" class="search-box" style="margin:0;">${options}</select>
      </div>
      <div class="upload-zone" id="dropZone" onclick="document.getElementById('csvFileInput').click()">
        Click to choose a CSV file, or drag and drop here<br>
        <span style="font-size:11px;">Expected columns: symbol, name, weight</span>
      </div>
      <input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="handleCsvFile(this.files[0])">
      <div id="csvResult"></div>
    </div>
  `;
  const dz = document.getElementById("dropZone");
  dz.addEventListener("dragover", e=>{ e.preventDefault(); dz.style.borderColor="var(--accent)"; });
  dz.addEventListener("dragleave", e=>{ dz.style.borderColor="var(--border)"; });
  dz.addEventListener("drop", e=>{
    e.preventDefault(); dz.style.borderColor="var(--border)";
    if(e.dataTransfer.files.length) handleCsvFile(e.dataTransfer.files[0]);
  });
}

function handleCsvFile(file){
  if(!file) return;
  const pid = document.getElementById("csvProductSelect").value;
  Papa.parse(file, {
    header:true, skipEmptyLines:true,
    complete: function(results){
      const rows = results.data.map(r=>{
        const keys = Object.keys(r).reduce((acc,k)=>{ acc[k.trim().toLowerCase()] = r[k]; return acc; },{});
        return {
          symbol: keys.symbol || keys.ticker || "",
          name: keys.name || keys["company name"] || "",
          weight: keys.weight || keys["weight (%)"] || keys["weight%"] || ""
        };
      }).filter(r=>r.symbol || r.name);
      uploadedConstituents[pid] = rows;
      const p = PRODUCTS.find(x=>x.id===pid);
      let totalWeight = 0;
      rows.forEach(r=>{ const w = parseFloat(r.weight); if(!isNaN(w)) totalWeight += (w>1? w : w*100 <=100 && w<=1 ? w*100 : w); });
      document.getElementById("csvResult").innerHTML = `
        <div class="callout">Loaded <strong>${rows.length}</strong> constituents for <strong>${p.name}</strong>. Approx. total weight: <strong>${totalWeight.toFixed(1)}%</strong> ${Math.abs(totalWeight-100)>2 ? '<span style="color:var(--amber)">— check weights sum to ~100%</span>' : '<span style="color:var(--green)">✓</span>'}</div>
        <table><tr><th>Symbol</th><th>Name</th><th>Weight</th></tr>
        ${rows.slice(0,50).map(r=>`<tr><td>${r.symbol}</td><td>${r.name}</td><td>${r.weight}</td></tr>`).join("")}
        </table>
        ${rows.length>50 ? `<div style="color:var(--text-dim); font-size:12px;">Showing first 50 of ${rows.length} rows.</div>` : ""}
        <button class="btn primary" style="margin-top:10px;" onclick="showProduct('${pid}')">View Product Note →</button>
      `;
    },
    error: function(err){
      document.getElementById("csvResult").innerHTML = `<div class="callout warn">Parse error: ${err.message}</div>`;
    }
  });
}

  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="topbar"><h1>Upgrade Roadmap</h1></div>
    <div class="callout">This dashboard is a working v1: static product notes, in-session CSV parsing, and file export — no server, no live pricing feed, no persistence beyond this file. Below is the intended path to the full integrated system described in scoping.</div>
    <div class="card">
      <div class="roadmap-item"><div class="roadmap-dot"></div><div><strong>Backend + database.</strong> Move product definitions, constituent history, and rebalance logs from this static file into a proper backend (e.g., Postgres) with versioning — every rebalance becomes an auditable record, not an overwrite.</div></div>
      <div class="roadmap-item"><div class="roadmap-dot"></div><div><strong>Live constituent management UI.</strong> Replace CSV-upload-only with an in-dashboard portfolio builder: search instruments, set weights with real-time sum validation, drag-and-drop sleeve rebalancing, and diff view against the prior rebalance.</div></div>
      <div class="roadmap-item"><div class="roadmap-dot"></div><div><strong>smallcase integration.</strong> Direct API push from the dashboard to smallcase's portfolio management endpoints for constituent/weight updates, eliminating manual re-entry on the platform.</div></div>
      <div class="roadmap-item"><div class="roadmap-dot"></div><div><strong>Compliance engine.</strong> Automated checks before any rebalance is published: single-stock/sector concentration caps, SEBI Research Analyst disclosure requirements, risk-profile-to-allocation consistency checks, and a maker-checker approval workflow.</div></div>
      <div class="roadmap-item"><div class="roadmap-dot"></div><div><strong>Live pricing &amp; performance tracking.</strong> Feed in daily prices for all constituents to compute live portfolio NAV, drawdown, tracking error vs. benchmark, and factor exposure drift — replacing the current static allocation bands with realized numbers.</div></div>
      <div class="roadmap-item"><div class="roadmap-dot"></div><div><strong>Tax module.</strong> STCG/LTCG tracking per lot, REIT/InvIT distribution component split (interest/dividend/capital return), and FoF taxation treatment — flagged as explicitly out of scope for this version.</div></div>
      <div class="roadmap-item"><div class="roadmap-dot"></div><div><strong>Client-facing reporting.</strong> Auto-generated, investor-ready factsheets (not just internal product notes) with performance, holdings, and risk metrics, refreshed on each rebalance.</div></div>

// ---------- EXPORT: EXCEL ----------
function productToRows(p){
  const rows = [];
  rows.push(["Field","Value"]);
  rows.push(["Product ID", p.id]);
  rows.push(["Code", p.code]);
  rows.push(["Name", p.name]);
  rows.push(["Category", p.category]);
  rows.push(["Asset Classes", p.assetClasses.join("; ")]);
  rows.push(["Objective", p.objective]);
  rows.push(["Philosophy/Methodology", p.philosophy || p.selectionMethodology || ""]);
  rows.push(["Benchmark", p.benchmark]);
  rows.push(["Rebalance Frequency", p.rebalanceFrequency]);
  rows.push(["Risk Profile", p.riskProfile]);
  rows.push(["Suitability", p.suitability]);
  rows.push(["Min Investment", p.minInvestment || ""]);
  rows.push(["Fees", p.fees || ""]);
  rows.push(["Tax Note", p.taxNote || ""]);
  rows.push(["Key Risks", (p.keyRisks||[]).join(" | ")]);
  return rows;
}

function exportXlsx(pid){
  const p = PRODUCTS.find(x=>x.id===pid);
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(productToRows(p));
  ws1['!cols'] = [{wch:24},{wch:100}];
  XLSX.utils.book_append_sheet(wb, ws1, "Product Note");

  if(p.styleSleeves){
    const rows = [["Sleeve","Weight Range","Criteria","Universe","Indicative Names"]];
    p.styleSleeves.forEach(s=>rows.push([s.name,s.weightRange,s.criteria,s.universe,s.indicativeNames]));
    const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:20},{wch:14},{wch:60},{wch:40},{wch:50}];
    XLSX.utils.book_append_sheet(wb, ws, "Style Sleeves");
  }
  if(p.strategicAllocationRanges){
    const rows = [["Sleeve","Target Range"]];
    p.strategicAllocationRanges.forEach(a=>rows.push([a.sleeve,a.range]));
    const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:60},{wch:14}];
    XLSX.utils.book_append_sheet(wb, ws, "Allocation Ranges");
  }
  if(p.variants){
    const rows = [["Variant","Sleeve","Target Range"]];
    p.variants.forEach(v=>{
      if(v.allocation) v.allocation.forEach(a=>rows.push([v.profile,a.sleeve,a.range]));
      else rows.push([v.profile, v.factorMix||"", v.universe||""]);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:14},{wch:55},{wch:14}];
    XLSX.utils.book_append_sheet(wb, ws, "Risk Variants");
  }
  if(p.goalFramework){
    const rows = [["Goal","Horizon Band","Glide Path"]];
    p.goalFramework.forEach(g=>rows.push([g.goal,g.horizonBand,g.glidePath]));
    const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:30},{wch:25},{wch:90}];
    XLSX.utils.book_append_sheet(wb, ws, "Goal Framework");
  }
  const instr = p.indicativeInstruments || p.sharedInstrumentUniverse;
  if(instr){
    const rows = [["Sleeve","Instruments"]];
    Object.keys(instr).forEach(k=>rows.push([k, instr[k]]));
    const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:20},{wch:100}];
    XLSX.utils.book_append_sheet(wb, ws, "Instrument Universe");
  }
  if(uploadedConstituents[pid] && uploadedConstituents[pid].length){
    const rows = [["Symbol","Name","Weight"]];
    uploadedConstituents[pid].forEach(r=>rows.push([r.symbol,r.name,r.weight]));
    const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:15},{wch:40},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws, "Constituents (Uploaded)");
  }
  XLSX.writeFile(wb, `${p.code}_${p.id}_ProductNote.xlsx`);
}

function exportAllXlsx(){
  const wb = XLSX.utils.book_new();
  const summaryRows = [["ID","Code","Name","Category","Risk Profile","Benchmark","Rebalance Frequency"]];
  PRODUCTS.forEach(p=>summaryRows.push([p.id,p.code,p.name,p.category,p.riskProfile,p.benchmark,p.rebalanceFrequency]));
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
  wsSummary['!cols'] = [{wch:6},{wch:16},{wch:55},{wch:35},{wch:16},{wch:50},{wch:40}];
  XLSX.utils.book_append_sheet(wb, wsSummary, "All Products Summary");
  PRODUCTS.forEach(p=>{
    const ws = XLSX.utils.aoa_to_sheet(productToRows(p));
    ws['!cols'] = [{wch:24},{wch:100}];
    XLSX.utils.book_append_sheet(wb, ws, p.code.slice(0,28));
  });
  XLSX.writeFile(wb, `Portfolio_Product_Suite_All9.xlsx`);
}

// ---------- EXPORT: WORD ----------
function exportDocx(pid){
  const p = PRODUCTS.find(x=>x.id===pid);
  const { Document, Packer, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType, BorderStyle } = docx;

  function h1(text){ return new Paragraph({ text, heading: HeadingLevel.HEADING_1, spacing:{before:280, after:120} }); }
  function h2(text){ return new Paragraph({ text, heading: HeadingLevel.HEADING_2, spacing:{before:220, after:100} }); }
  function body(text){ return new Paragraph({ children:[new TextRun(text||"—")], spacing:{after:160} }); }
  function bullet(text){ return new Paragraph({ text, bullet:{level:0}, spacing:{after:60} }); }
  function kvPara(k,v){ return new Paragraph({ children:[ new TextRun({text:k+": ", bold:true}), new TextRun(v||"—") ], spacing:{after:80} }); }

  function simpleTable(headerRow, dataRows){
    const mkCell = (text, bold) => new TableCell({
      children:[new Paragraph({children:[new TextRun({text:String(text||""), bold:!!bold})]})],
      margins:{top:80,bottom:80,left:100,right:100}
    });
    const rows = [ new TableRow({ children: headerRow.map(h=>mkCell(h,true)) }) ];
    dataRows.forEach(r=> rows.push(new TableRow({ children: r.map(c=>mkCell(c,false)) })));
    return new Table({ rows, width:{size:100, type:WidthType.PERCENTAGE} });
  }

  const children = [];
  children.push(new Paragraph({ text: p.name, heading: HeadingLevel.TITLE, spacing:{after:60} }));
  children.push(new Paragraph({ children:[new TextRun({text:`${p.category}  ·  Code: ${p.code}  ·  Product Note`, italics:true, color:"666666"})], spacing:{after:240} }));

  children.push(h2("Key Facts"));
  children.push(kvPara("Risk Profile", p.riskProfile));
  children.push(kvPara("Asset Classes", p.assetClasses.join("; ")));
  children.push(kvPara("Benchmark", p.benchmark));
  children.push(kvPara("Rebalance Frequency", p.rebalanceFrequency));
  children.push(kvPara("Minimum Investment", p.minInvestment||"—"));
  children.push(kvPara("Fees", p.fees||"—"));

  children.push(h2("Investment Objective"));
  children.push(body(p.objective));

  children.push(h2("Philosophy & Methodology"));
  children.push(body(p.philosophy || p.selectionMethodology || ""));
  if(p.portfolioConstruction) children.push(kvPara("Portfolio Construction", p.portfolioConstruction));
  if(p.portfolioConstructionNote) children.push(body(p.portfolioConstructionNote));

  if(p.styleSleeves){
    children.push(h2("Style Sleeves"));
    children.push(simpleTable(
      ["Sleeve","Weight Range","Criteria","Universe","Indicative Names"],
      p.styleSleeves.map(s=>[s.name,s.weightRange,s.criteria,s.universe,s.indicativeNames])
    ));
  }

  if(p.strategicAllocationRanges){
    children.push(h2("Strategic Allocation Ranges"));
    children.push(simpleTable(["Sleeve","Target Range"], p.strategicAllocationRanges.map(a=>[a.sleeve,a.range])));
  }

  if(p.variants){
    children.push(h2("Risk-Profile Variants"));
    p.variants.forEach(v=>{
      children.push(new Paragraph({ children:[new TextRun({text:v.profile, bold:true, size:26})], spacing:{before:160,after:80} }));
      if(v.targetInvestor) children.push(body(v.targetInvestor));
      if(v.factorMix){
        children.push(kvPara("Factor Mix", v.factorMix));
        children.push(kvPara("Universe", v.universe));
        children.push(kvPara("Stock Count", v.stockCount));
        children.push(kvPara("Reference Index", v.referenceIndex));
        children.push(body(v.rationale));
      }
      if(v.allocation){
        children.push(simpleTable(["Sleeve","Target Range"], v.allocation.map(a=>[a.sleeve,a.range])));
        if(v.expectedEquityLikeExposure) children.push(kvPara("Equity-like Exposure", v.expectedEquityLikeExposure));
      }
    });
  }

  if(p.goalFramework){
    children.push(h2("Life Goal Framework (Glide Path)"));
    p.goalFramework.forEach(g=>{
      children.push(new Paragraph({ children:[new TextRun({text:`${g.goal} — ${g.horizonBand}`, bold:true})], spacing:{before:140,after:60} }));
      children.push(body(g.glidePath));
      if(g.riskProfileAdjustment) children.push(kvPara("Risk-profile adjustment", g.riskProfileAdjustment));
    });
  }

  const instr = p.indicativeInstruments || p.sharedInstrumentUniverse;
  if(instr){
    children.push(h2("Indicative Instrument Universe"));
    Object.keys(instr).forEach(k=>{
      children.push(kvPara(k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()), instr[k]));
    });
    children.push(new Paragraph({ children:[new TextRun({text:"Illustrative universe based on public data as of mid-2026. Reconfirm eligible instruments, tickers, and AUM/liquidity thresholds at each rebalance and before launch.", italics:true, color:"996600"})], spacing:{before:80,after:160} }));
  }

  if(uploadedConstituents[pid] && uploadedConstituents[pid].length){
    children.push(h2("Uploaded Constituents & Weights"));
    children.push(simpleTable(["Symbol","Name","Weight"], uploadedConstituents[pid].map(r=>[r.symbol,r.name,r.weight])));
  }

  children.push(h2("Suitability"));
  children.push(body(p.suitability));

  children.push(h2("Key Risks"));
  (p.keyRisks||[]).forEach(r=>children.push(bullet(r)));

  children.push(h2("Tax & Fees"));
  children.push(kvPara("Fees", p.fees||"—"));
  children.push(kvPara("Tax Treatment", p.taxNote || "To be detailed in a future revision."));

  children.push(new Paragraph({ children:[new TextRun({text:`Product code ${p.code} · Internal / product-development document. Not investor-facing until reviewed for SEBI Research Analyst / smallcase compliance requirements, final fee structure, and tax disclosures.`, italics:true, size:18, color:"888888"})], spacing:{before:300} }));

  const doc = new Document({ sections:[{ properties:{}, children }] });
  Packer.toBlob(doc).then(blob=>{
    saveAs(blob, `${p.code}_${p.id}_ProductNote.docx`);
  });
}

// init
renderNav();
showView('overview');
