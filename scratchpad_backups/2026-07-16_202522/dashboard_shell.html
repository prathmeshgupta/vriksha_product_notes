<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vriksha — Product Note Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;1,400;1,500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }

  :root{
    --forest:      #0f1a12;
    --deep:        #0a1209;
    --canopy:      #1a2e1d;
    --moss:        #2d4a32;
    --sage:        #7a9e7e;
    --pale:        #c8d9c9;
    --mist:        #e8f0e9;
    --gold:        #c4a84f;
    --gold-dim:    rgba(196,168,79,0.35);
    --text:        #dde8de;
    --text-dim:    rgba(221,232,222,0.55);
    --text-faint:  rgba(221,232,222,0.25);
    --red:         #d97a6c;
    --amber:       #d4b06a;
    --green:       #8fb894;
    --radius: 3px;
  }

  html{ scroll-behavior:smooth; }

  body{
    background:var(--forest); color:var(--text);
    font-family:'Lora', Georgia, serif; font-size:15px; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }

  .mono{ font-family:'JetBrains Mono', monospace; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--moss); border-radius:5px; }
  ::-webkit-scrollbar-track{ background:var(--deep); }

  /* ── APP SHELL ── */
  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:300px; flex-shrink:0; background:var(--deep);
    border-right:1px solid var(--canopy);
    padding:24px 18px; position:sticky; top:0; height:100vh; overflow-y:auto; overflow-x:hidden;
    scrollbar-width: none; /* Firefox: hide by default */
    scrollbar-gutter: stable; /* reserve space so content doesn't shift when scrollbar appears */
    transition: width .18s ease, padding .18s ease;
  }
  /* Sidebar scrollbar stays closed (invisible, zero-width) until the sidebar is
     hovered or actively scrolled — keeps the left edge clean at rest while still
     letting the list scroll normally when it overflows. */
  .sidebar::-webkit-scrollbar{ width:0px; }
  .sidebar:hover::-webkit-scrollbar, .sidebar:focus-within::-webkit-scrollbar{ width:6px; }
  .sidebar::-webkit-scrollbar-thumb{ background:var(--moss); border-radius:5px; }
  .sidebar::-webkit-scrollbar-track{ background:transparent; }
  .sidebar:hover{ scrollbar-width: thin; } /* Firefox: reveal thin scrollbar on hover */

  /* ── SIDEBAR COLLAPSE ── */
  /* Collapsed = a thin 40px rail showing only the toggle button. Everything else
     in the sidebar (brand, search, nav) is hidden outright rather than squeezed —
     partial-width collapse with truncated text looked broken, so this goes fully minimal. */
  .sidebar.collapsed{ width:40px; padding:24px 8px; }
  .sidebar.collapsed .brand-sub, .sidebar.collapsed .search-box,
  .sidebar.collapsed #navList, .sidebar.collapsed .nav-group-title,
  .sidebar.collapsed .brand, .sidebar.collapsed .nav-item{ display:none !important; }
  .sidebar-toggle{
    display:flex; align-items:center; justify-content:center;
    width:26px; height:26px; margin-bottom:14px; cursor:pointer; flex-shrink:0;
    border:1px solid var(--moss); border-radius:var(--radius); background:transparent;
    color:var(--sage); font-family:'JetBrains Mono', monospace; font-size:.75rem;
    transition:.15s;
  }
  .sidebar-toggle:hover{ border-color:var(--gold); color:var(--gold); }
  .sidebar.collapsed .sidebar-toggle{ margin:0 auto; }
  .sidebar-top-row{ display:flex; align-items:center; justify-content:space-between; }
  .sidebar.collapsed .sidebar-top-row{ display:block; }

  .brand{ display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }
  .brand-word{
    font-family:'Syne', sans-serif; font-size:1.05rem; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--mist);
  }
  .brand-tag{
    font-family:'JetBrains Mono', monospace; font-size:.6rem; font-weight:300;
    color:var(--sage); letter-spacing:.04em;
  }
  .brand-sub{
    font-family:'JetBrains Mono', monospace; font-size:.65rem; color:var(--text-faint);
    margin-bottom:22px; letter-spacing:.04em;
  }

  .search-box{
    width:100%; padding:9px 12px; border-radius:var(--radius);
    border:1px solid var(--canopy); background:var(--forest); color:var(--text);
    font-family:'JetBrains Mono', monospace; font-size:.72rem; margin-bottom:16px;
    letter-spacing:.02em;
  }
  .search-box::placeholder{ color:var(--text-faint); }
  .search-box:focus{ outline:none; border-color:var(--moss); }

  .nav-group-title{
    font-family:'JetBrains Mono', monospace; font-size:.62rem; text-transform:uppercase;
    letter-spacing:.18em; color:var(--sage); margin:18px 0 8px; display:flex; align-items:center; gap:10px;
  }
  .nav-group-title::before{ content:''; width:14px; height:1px; background:var(--gold-dim); }

  .nav-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 10px; border-radius:var(--radius); cursor:pointer; margin-bottom:2px;
    color:var(--text-dim); font-size:.82rem; border:1px solid transparent; transition:.15s;
    font-family:'Lora', serif;
  }
  .nav-item:hover{ background:var(--canopy); color:var(--mist); }
  .nav-item.active{ background:var(--canopy); color:var(--mist); border-left:2px solid var(--gold); padding-left:8px; }
  .nav-item .code{
    font-family:'JetBrains Mono', monospace; font-size:.6rem; opacity:.6; letter-spacing:.02em;
  }
  .status-dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; margin-left:6px; }
  .status-dot.published{ background:var(--green); }
  .status-dot.draft{ background:var(--amber); }

  .main{ flex:1; padding:36px 48px; max-width:1220px; }

  /* ── TOPBAR ── */
  .topbar{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:26px; gap:16px; flex-wrap:wrap; }
  .topbar h1{
    font-family:'Syne', sans-serif; font-size:1.7rem; font-weight:700;
    text-transform:uppercase; letter-spacing:-.01em; color:var(--mist); margin-bottom:6px;
  }
  .topbar-sub{ font-family:'JetBrains Mono', monospace; font-size:.7rem; color:var(--sage); letter-spacing:.04em; }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; }

  .btn{
    background:transparent; border:1px solid var(--moss); color:var(--text-dim);
    padding:9px 16px; border-radius:var(--radius); cursor:pointer;
    font-family:'JetBrains Mono', monospace; font-size:.7rem; font-weight:400;
    letter-spacing:.06em; text-transform:uppercase;
    display:inline-flex; align-items:center; gap:6px; transition:.15s;
  }
  .btn:hover{ border-color:var(--gold); color:var(--mist); }
  .btn.primary{ background:var(--gold); border-color:var(--gold); color:var(--deep); font-weight:500; }
  .btn.primary:hover{ filter:brightness(1.08); color:var(--deep); }
  .btn.danger{ border-color:var(--red); color:var(--red); }
  .btn.danger:hover{ background:rgba(217,122,108,.1); }
  .btn.small{ padding:6px 12px; font-size:.62rem; }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .btn:disabled:hover{ border-color:var(--moss); color:var(--text-dim); }

  /* ── CARD / SECTION ── */
  .card{
    background:var(--canopy); border:1px solid var(--moss); border-radius:var(--radius);
    padding:26px 28px; margin-bottom:16px;
  }
  .card.flush{ padding:0; overflow:hidden; }

  h2.section{
    font-family:'Syne', sans-serif; font-size:.92rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.04em; color:var(--mist); margin:30px 0 14px; padding-bottom:10px;
    border-bottom:1px solid var(--canopy); display:flex; align-items:center; justify-content:space-between;
  }
  h2.section .s-label-inline{
    font-family:'JetBrains Mono', monospace; font-size:.6rem; color:var(--sage); font-weight:400; letter-spacing:.1em;
  }

  .callout{
    background:var(--deep); border-left:3px solid var(--gold); padding:14px 18px; border-radius:2px;
    font-family:'JetBrains Mono', monospace; font-size:.72rem; color:var(--sage); line-height:1.8;
    margin:10px 0; letter-spacing:.01em;
  }
  .callout.warn{ border-left-color:var(--amber); color:var(--amber); }
  .callout.danger{ border-left-color:var(--red); color:var(--red); }

  /* ── OVERVIEW GRID ── */
  .grid-overview{ display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:2px; margin-top:8px; }
  .p-card{
    cursor:pointer; background:var(--canopy); border:1px solid var(--moss); padding:24px 22px;
    position:relative; transition:.2s;
  }
  .p-card::before{ content:''; position:absolute; top:0; left:0; width:2px; height:0; background:var(--gold); transition:height .3s; }
  .p-card:hover{ background:var(--moss); }
  .p-card:hover::before{ height:100%; }
  .p-card .tag{
    font-family:'JetBrains Mono', monospace; font-size:.6rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:12px; display:flex; align-items:center; gap:8px;
  }
  .p-card .tag.sys{ color:rgba(196,168,79,.55); }
  .p-card h3{ font-family:'Syne', sans-serif; font-size:1rem; font-weight:600; color:var(--mist); margin:0 0 8px; line-height:1.35; }
  .p-card p{ color:var(--text-dim); font-size:.82rem; margin:0 0 14px; line-height:1.7; }
  .p-card .meta{ display:flex; gap:14px; align-items:center; font-family:'JetBrains Mono', monospace; font-size:.62rem; color:var(--text-faint); letter-spacing:.04em; }

  .risk-badge{ padding:2px 9px; border-radius:20px; font-size:.6rem; font-weight:500; letter-spacing:.06em; text-transform:uppercase; font-family:'JetBrains Mono', monospace; }
  .risk-high{ background:rgba(217,122,108,.14); color:var(--red); }
  .risk-mod{ background:rgba(212,176,106,.14); color:var(--amber); }
  .risk-low{ background:rgba(143,184,148,.14); color:var(--green); }
  .risk-var{ background:rgba(122,158,126,.14); color:var(--sage); }

  /* ── KV / FIELDS ── */
  .kv{ display:grid; grid-template-columns:200px 1fr; gap:8px 18px; margin-bottom:8px; font-size:.86rem; align-items:start; }
  .kv .k{ color:var(--sage); font-family:'JetBrains Mono', monospace; font-size:.68rem; letter-spacing:.05em; text-transform:uppercase; padding-top:4px; }
  .kv .v{ color:var(--text); }

  /* ── TABLES ── */
  table{ width:100%; border-collapse:collapse; font-size:.82rem; margin:10px 0; }
  th,td{ text-align:left; padding:9px 12px; border-bottom:1px solid var(--canopy); vertical-align:top; }
  th{ font-family:'JetBrains Mono', monospace; color:var(--sage); font-weight:400; font-size:.62rem; text-transform:uppercase; letter-spacing:.08em; }
  td{ color:var(--text-dim); }
  tr:hover td{ background:rgba(122,158,126,.04); }

  /* ── FORM CONTROLS (editor) ── */
  .field-row{ display:grid; grid-template-columns:200px 1fr; gap:10px 18px; align-items:start; margin-bottom:12px; }
  .field-label{ font-family:'JetBrains Mono', monospace; font-size:.66rem; color:var(--sage); letter-spacing:.05em; text-transform:uppercase; padding-top:9px; }
  input[type=text], input[type=number], textarea, select{
    width:100%; background:var(--deep); border:1px solid var(--moss); color:var(--text);
    padding:9px 11px; border-radius:2px; font-family:'Lora', serif; font-size:.86rem;
  }
  input[type=number]{ font-family:'JetBrains Mono', monospace; }
  textarea{ resize:vertical; min-height:70px; line-height:1.6; }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--gold); }
  .input-sm{ width:90px; }
  .weight-sum-badge{
    font-family:'JetBrains Mono', monospace; font-size:.68rem; padding:4px 10px; border-radius:20px; display:inline-block; margin-top:6px;
  }
  .weight-sum-ok{ background:rgba(143,184,148,.14); color:var(--green); }
  .weight-sum-bad{ background:rgba(217,122,108,.14); color:var(--red); }

  .editable-table-row{ display:grid; grid-template-columns:1fr 110px 110px 34px; gap:8px; margin-bottom:6px; align-items:center; }
  .editable-table-row.four{ grid-template-columns:1fr 1.4fr 90px 90px 34px; }
  .row-remove{
    background:transparent; border:1px solid var(--moss); color:var(--text-faint); width:30px; height:30px;
    border-radius:2px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:.9rem;
  }
  .row-remove:hover{ border-color:var(--red); color:var(--red); }
  .risk-item-row{ display:grid; grid-template-columns:1fr 34px; gap:8px; margin-bottom:6px; }

  .edit-mode-toggle{ display:flex; gap:4px; background:var(--deep); border:1px solid var(--moss); border-radius:20px; padding:3px; }
  .edit-mode-toggle .seg{
    padding:5px 14px; border-radius:20px; font-family:'JetBrains Mono', monospace; font-size:.62rem;
    text-transform:uppercase; letter-spacing:.06em; cursor:pointer; color:var(--text-dim);
  }
  .edit-mode-toggle .seg.active{ background:var(--gold); color:var(--deep); }

  /* ── STATUS PILL ── */
  .status-pill{
    display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px;
    font-family:'JetBrains Mono', monospace; font-size:.64rem; text-transform:uppercase; letter-spacing:.06em;
  }
  .status-pill.published{ background:rgba(143,184,148,.14); color:var(--green); }
  .status-pill.draft{ background:rgba(212,176,106,.14); color:var(--amber); }
  .status-pill .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .pill{
    display:inline-block; background:var(--deep); border:1px solid var(--moss); padding:4px 11px; border-radius:20px;
    font-family:'JetBrains Mono', monospace; font-size:.66rem; margin:0 5px 5px 0; color:var(--text-dim); letter-spacing:.02em;
  }

  /* ── VARIANT TABS ── */
  .variant-tabs{ display:flex; gap:6px; margin-bottom:16px; }
  .variant-tab{
    padding:7px 16px; border-radius:20px; background:var(--deep); border:1px solid var(--moss);
    cursor:pointer; font-family:'JetBrains Mono', monospace; font-size:.68rem; text-transform:uppercase;
    letter-spacing:.05em; color:var(--text-dim);
  }
  .variant-tab.active{ background:rgba(196,168,79,.14); color:var(--gold); border-color:var(--gold); }

  .risk-list{ margin:8px 0 0; padding-left:0; list-style:none; }
  .risk-list li{ margin-bottom:8px; padding-left:20px; position:relative; color:var(--text-dim); font-size:.84rem; line-height:1.7; }
  .risk-list li::before{ content:'—'; position:absolute; left:0; color:var(--gold); }

  .upload-zone{
    border:1px dashed var(--moss); border-radius:2px; padding:30px; text-align:center; color:var(--text-dim);
    cursor:pointer; font-family:'JetBrains Mono', monospace; font-size:.74rem; margin-top:10px; transition:.15s;
  }
  .upload-zone:hover{ border-color:var(--gold); color:var(--gold); }

  .footer-note{
    color:var(--text-faint); font-family:'JetBrains Mono', monospace; font-size:.64rem; margin-top:34px;
    border-top:1px solid var(--canopy); padding-top:16px; line-height:1.8;
  }

  /* ── VERSION HISTORY ── */
  .version-row{
    display:flex; justify-content:space-between; align-items:center; padding:12px 16px;
    border:1px solid var(--moss); border-radius:2px; margin-bottom:8px; background:var(--deep);
  }
  .version-row .vmeta{ font-family:'JetBrains Mono', monospace; font-size:.72rem; color:var(--pale); }
  .version-row .vtime{ color:var(--text-faint); font-size:.64rem; margin-top:3px; }
  .diff-add{ background:rgba(143,184,148,.14); color:var(--green); padding:1px 4px; border-radius:2px; }
  .diff-remove{ background:rgba(217,122,108,.14); color:var(--red); text-decoration:line-through; padding:1px 4px; border-radius:2px; }
  .diff-field{
    border:1px solid var(--moss); border-radius:2px; padding:14px 16px; margin-bottom:10px; background:var(--deep);
  }
  .diff-field .df-label{ font-family:'JetBrains Mono', monospace; font-size:.64rem; color:var(--sage); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .diff-unchanged{ color:var(--text-faint); font-style:italic; font-size:.7rem; font-family:'JetBrains Mono', monospace; }

  .roadmap-item{ display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--canopy); }
  .roadmap-item:last-child{ border-bottom:none; }
  .roadmap-dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); margin-top:8px; flex-shrink:0; }

  select#navSearch, select#csvProductSelect{ font-family:'JetBrains Mono', monospace; }

  @media (max-width:900px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; }
    .main{ padding:24px 20px; }
    .field-row, .kv{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="appSidebar">
    <div class="sidebar-top-row">
      <div class="brand">
        <span class="brand-word">Vriksha</span>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="Collapse menu">‹</button>
    </div>
    <div class="brand-sub">// product note studio — v2</div>
    <input class="search-box" id="navSearch" placeholder="search products..." oninput="renderNav()">
    <div id="navList"></div>
    <div class="nav-group-title">Tools</div>
    <div class="nav-item" onclick="showView('overview')" id="nav-overview">Overview</div>
    <div class="nav-item" onclick="showView('create')" id="nav-create">+ New Product</div>
    <div class="nav-item" onclick="showView('archive')" id="nav-archive">Archived Products</div>
    <div class="nav-item" onclick="showView('csv')" id="nav-csv">CSV Constituent Upload</div>
    <div class="nav-item" onclick="showView('backup')" id="nav-backup">Backup &amp; Sync</div>
    <div class="nav-item" onclick="showView('roadmap')" id="nav-roadmap">Upgrade Roadmap</div>
  </div>
  <div class="main" id="main"></div>
</div>
<script id="app-script-placeholder">/* JS_GOES_HERE */</script>
</body>
</html>
